# TURN 中继 + 反代部署。
# - coturn：TURN 中继（打洞失败兜底），auth-secret 与信令服务共享 TURN_SECRET。
#   server 用 generateTurnCredentials(TURN_SECRET, ...) 生成短期凭证，coturn 用同一 secret 校验。
# - 信令服务（Fastify）本机用 `pnpm --filter @hole-io/server start` 跑（PM2 守护）；
#   生产容器化时再补 Dockerfile。nginx 做 TLS 终止 + wss 反代到 127.0.0.1:3001。
# 启动：`cd infra && cp .env.example .env && docker compose up -d coturn`。
services:
  coturn:
    image: coturn/coturn:4.6
    container_name: hole-coturn
    restart: unless-stopped
    # host 网络避免逐个映射 relay UDP 端口范围（Linux 生产推荐）；
    # 不支持 host 网络时改用 ports 映射："3478:3478/tcp"、"3478:3478/udp"、"49152-65535:49152-65535/udp"。
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    # secret/realm 由 compose 从 .env 注入（与 server 的 TURN_SECRET 必须一致）
    command: turnserver -c /etc/turnserver.conf --static-auth-secret ${TURN_SECRET} --realm ${TURN_REALM}
