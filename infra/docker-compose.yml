services:
  postgres:
    image: postgres:17-alpine
    container_name: hole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: holeio
      POSTGRES_DB: holeio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hole-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holeio -d holeio"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6
    container_name: hole-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    command:
      - turnserver
      - -c
      - /etc/turnserver.conf
      - --static-auth-secret
      - ${TURN_SECRET:?set TURN_SECRET in infra/.env}
      - --realm
      - ${TURN_REALM:-hole.io}

volumes:
  hole-postgres-data:
