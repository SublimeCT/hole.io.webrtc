# coturn TURN 中继配置（auth-secret 模式）。
# static-auth-secret、realm 和 external-ip 按 Ubuntu 部署文档写入 /etc/turnserver.conf，不在仓库明文。
# 信令服务用相同 secret 生成短期凭证（packages/server/src/turn.ts）。

listening-port=3478
fingerprint
use-auth-secret

# v1 简化：不启用 TLS/DTLS（信令走 nginx 的 wss；TURN over TLS 后续按需加 certfile/pkeyfile）。
no-tls
no-dtls

no-cli
no-multicast-peers
no-loopback-peers

# relay UDP 端口范围由现有 TURN 部署同步开放。
min-port=49160
max-port=49260

# 单个临时用户最多 8 个 allocation，全局最多 80 个。
# 浏览器打洞成功后不占 TURN allocation；达到配额时拒绝新增中继。
user-quota=8
total-quota=80
stale-nonce=600

# 日志
log-file=stdout
simple-log
