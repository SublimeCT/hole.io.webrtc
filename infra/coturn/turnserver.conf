# coturn TURN 中继配置（auth-secret 模式）。
# static-auth-secret、realm 和 external-ip 按 Ubuntu 部署文档写入 /etc/turnserver.conf，不在仓库明文。
# 信令服务用相同 secret 生成短期凭证（packages/server/src/turn.ts）。

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# user=test:test

cert=/etc/turnserver_cert.pem
pkey=/etc/turnserver_privkey.pem

# v1 简化：不启用 TLS/DTLS（信令走 nginx 的 wss；TURN over TLS 后续按需加 certfile/pkeyfile）。
# no-tls
# no-dtls

no-cli
no-multicast-peers
no-loopback-peers

# 禁止把 TURN 当跳板中继到私网/保留段（防内网扫描/放大攻击）。coturn 官方推荐集。
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# relay UDP 端口范围在部署文档（docs/deploy.md「配置 TURN」）的防火墙步骤开放。
min-port=49160
max-port=49260

# 单个临时用户最多 8 个 allocation，全局最多 80 个。
# 浏览器打洞成功后不占 TURN allocation；达到配额时拒绝新增中继。
user-quota=8
total-quota=80
stale-nonce=600

# 日志
# log-file=stdout
# simple-log
verbose
log-file=/var/log/turnserver/turnserver.log

static-auth-secret=your-secret
realm=your-host
external-ip=your-host-ip