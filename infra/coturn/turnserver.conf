# coturn TURN 中继配置（auth-secret 模式）。
# static-auth-secret 与 realm 由 docker compose command 传入（见 ../docker-compose.yml），不在此明文。
# 信令服务用相同 secret 生成短期凭证（packages/server/src/turn.ts）。

listening-port=3478
fingerprint
use-auth-secret

# v1 简化：不启用 TLS/DTLS（信令走 nginx 的 wss；TURN over TLS 后续按需加 certfile/pkeyfile）。
no-tls
no-dtls

no-cli
no-multicast-peers
no-loopback-peers

# relay UDP 端口范围（与 docker 端口映射/host 网络对应）
min-port=49152
max-port=65535

# 日志
log-file=stdout
simple-log
