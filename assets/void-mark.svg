<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2bf0ff" />
      <stop offset=".55" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#2bf0ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#11172a" />
  <circle
    cx="32"
    cy="32"
    r="20"
    fill="none"
    stroke="url(#ring)"
    stroke-width="9"
    filter="url(#glow)"
  />
  <circle cx="32" cy="32" r="10" fill="#03040a" />
</svg>
